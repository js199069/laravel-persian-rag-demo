name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: PHP ${{ matrix.php }} · PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        postgres: ['17', '18']

    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: persian_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: packages/laravel-persian-rag

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, zip, pdo_pgsql, pgsql, iconv
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --fail-on-skipped
        env:
          RAG_TEST_DB_HOST: 127.0.0.1
          RAG_TEST_DB_PORT: 5432
          RAG_TEST_DB_DATABASE: persian_rag_test
          RAG_TEST_DB_USERNAME: rag
          RAG_TEST_DB_PASSWORD: rag